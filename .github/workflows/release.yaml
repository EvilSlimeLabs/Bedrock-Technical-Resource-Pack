name: Release Resource Pack

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on semantic version tags like v1.2.3

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for pushing changes and creating releases
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for changelog

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Fix transparent images
        run: python clearPictureFixer.py

      - name: Extract version from tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      # The tag is the release's authority on the version, so it is written into
      # package.json and manifest.json (version, pack name, description prefix)
      # before anything is built. `npm run release` then refuses to package if
      # they still disagree.
      - name: Apply the tagged version
        run: npm run set-version -- ${{ steps.get_version.outputs.version }}

      - name: Commit and push the version bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if ! git diff --quiet -- package.json manifest.json; then
            git add package.json manifest.json
            git commit -m "chore: update version to v${{ steps.get_version.outputs.version }} [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME%%/*}
          fi

      # Type-free check, reference audit, test suites, then the bundler. The
      # .mcpack lands in dist/ and is the only artifact published.
      - name: Validate, test and compile the pack
        run: npm run release

      - name: Locate the artifact
        id: artifact
        run: echo "path=$(ls dist/*.mcpack)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const mcpackPath = '${{ steps.artifact.outputs.path }}';
            const mcpackData = fs.readFileSync(mcpackPath);

            const { data: releaseData } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: 'Release v${{ steps.get_version.outputs.version }}',
              generate_release_notes: true
            });

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseData.id,
              name: path.basename(mcpackPath),
              data: mcpackData
            });
